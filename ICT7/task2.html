<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Alert Message</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: grid;
            place-items: center;
            height: 100vh;
            margin: 0;
            background: #f4f4f4;
        }
        .box {
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        button {
            padding: 10px 18px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Alert Example</h2>
        <button id="alertBtn">Click Me</button>
    </div>

    <script>
        document.getElementById("alertBtn").addEventListener("click", function () {
            alert("Hello! This is an alert message.");
        });
    </script>
</body>
</html>
