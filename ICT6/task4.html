<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body {
            align-items: center;
            background: #f2f2f2;
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
        }

        form {
            background: white;
            border: 1px solid #611818;
            border-radius: 8px;
            padding: 25px;
            width: 280px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin: 12px 0 5px;
        }

        input {
            border: 1px solid #aaa;
            border-radius: 4px;
            padding: 10px;
            width: 100%;
        }

        button {
            background: #1976d2;
            border: 0;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            padding: 10px;
            width: 100%;
        }

        button:hover {
            background: #125ca1;
        }

        .forgot-password {
            display: block;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <form>
        <h1>Login</h1>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Submit</button>
        <a class="forgot-password" href="#">Forgot Password?</a>
    </form>
</body>
</html>
