<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Table</title>
    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px 15px;
        }

        h1 {
            color: #172033;
            text-align: center;
        }

        .table-container {
            margin: auto;
            max-width: 900px;
            overflow-x: auto;
        }

        table {
            background-color: white;
            border-collapse: collapse;
            min-width: 600px;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #172033;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #eef4ff;
        }

        a {
            color: #2563eb;
        }
    </style>
</head>
<body>
    <h1>Student List</h1>

    <div class="table-container">
        <table>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Grade</th>
                <th>Email</th>
            </tr>

</body>
</html>
