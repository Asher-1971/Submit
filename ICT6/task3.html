<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <style>
        body {
            align-items: center;
            background: #f2f2f2;
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 3px 8px #0002;
            max-width: 320px;
            overflow: hidden;
            padding-bottom: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            box-shadow: 0 20px 16px #0003;
            transform: translateY(-5px);
        }

        .card img {
            display: block;
            height: 200px;
            object-fit: cover;
            width: 100%;
        }

        .card-content {
            padding: 20px;
        }

        h1 {
            color: #172033;
            font-size: 24px;
            margin: 0 0 10px;
        }

        p {
            color: #555;
            line-height: 1.5;
            margin: 0 0 15px;
        }

        .price {
            color: #1976d2;
            display: block;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            background: #1976d2;
            border: 0;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            padding: 11px 20px;
            width: 100%;
        }

        button:hover {
            background: #125ca1;
        }
    </style>
</head>
<body>
    <article class="card">
        <img src="1.jpg" alt="Gaming setup product">
        <div class="card-content">
            <h1>Gaming Setup</h1>
            <p>Upgrade your gaming space with this stylish and comfortable gaming setup.</p>
            <span class="price">$6767.67</span>
            <button type="button">Buy Now</button>
        </div>
    </article>
</body>
</html>
